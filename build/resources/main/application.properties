spring.application.name=inventory-system

spring.datasource.url=jdbc:postgresql://localhost:5433/inventory_db
spring.datasource.username=${DB_USERNAME:inventory_app}
spring.datasource.password=${DB_PASSWORD}

# 'update' is convenient for local development; switch to 'validate'
# and manage schema changes with a migration tool (Flyway/Liquibase)
# before this goes anywhere near production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
